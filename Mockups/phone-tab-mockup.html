<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone &amp; Tablet Mockup Generator | PixelCraftin</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png">

  <style>
    :root {
      --bg: #070709;
      --bg-card: rgba(16, 16, 22, 0.75);
      --bg-raised: rgba(26, 26, 36, 0.8);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(92, 124, 250, 0.4);
      --text: #f3f3f8;
      --text-muted: #9494a6;
      --accent: #5c7cfa;
      --accent-gradient: linear-gradient(135deg, #5c7cfa, #9775fa);
      --accent-glow: rgba(92, 124, 250, 0.35);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Outfit', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(92, 124, 250, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(151, 117, 250, 0.1), transparent);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Ambient Header Bar */
    .app-header {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 10, 14, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .brand-text h1 {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0;
    }

    .brand-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 0;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-pill {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .badge-pill.accent {
      color: var(--accent);
      border-color: rgba(92, 124, 250, 0.3);
      background: rgba(92, 124, 250, 0.1);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      background: var(--bg-raised);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s var(--ease);
    }

    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(92, 124, 250, 0.1);
    }

    /* Studio Main Layout */
    .studio-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px;
      width: 100%;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 28px;
      align-items: start;
    }

    /* Left Stage: Canvas Artboard */
    .artboard-stage {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .canvas-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
    }

    .canvas-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(92, 124, 250, 0.08), transparent 70%);
      pointer-events: none;
    }

    .canvas-wrap {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    canvas#cv {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 2500 / 3000;
      cursor: pointer;
      background: #000;
      transition: filter 0.2s;
    }

    .canvas-hints {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 6px 0;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .hint-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .hint-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    /* Quick Upload Buttons */
    .quick-upload-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .upload-action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px dashed var(--border);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      text-align: center;
    }

    .upload-action-btn:hover {
      border-color: var(--accent);
      background: rgba(92, 124, 250, 0.08);
      color: var(--accent);
      border-style: solid;
    }

    /* Right Inspector / Tool Panel */
    .inspector-panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .control-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: border-color 0.2s;
    }

    .control-card:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .card-title h3 {
      font-family: var(--font-display);
      font-size: 0.96rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      margin: 0;
    }

    .card-title .card-tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--bg-raised);
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* Form Grids & Inputs */
    .input-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .input-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .val-badge {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--accent);
      background: rgba(92, 124, 250, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Color picker & Hex row */
    .color-input-wrapper {
      display: flex;
      align-items: center;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      gap: 10px;
      transition: border-color 0.2s;
    }

    .color-input-wrapper:hover,
    .color-input-wrapper:focus-within {
      border-color: var(--accent);
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
    }

    input[type="text"] {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.86rem;
      font-weight: 600;
      outline: none;
    }

    input.text-standalone {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.88rem;
      transition: border-color 0.2s;
    }

    input.text-standalone:focus {
      border-color: var(--accent);
    }

    select.select-styled {
      width: 100%;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: var(--text);
      font-family: var(--font-main);
      font-size: 0.86rem;
      font-weight: 500;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select.select-styled:focus,
    select.select-styled:hover {
      border-color: var(--accent);
    }

    /* Range Sliders */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
      border: 2px solid #fff;
      cursor: pointer;
      transition: transform 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Quick Preset Pills */
    .preset-pills-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .preset-pill-btn {
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s var(--ease);
    }

    .preset-pill-btn:hover {
      border-color: var(--accent);
      background: rgba(92, 124, 250, 0.15);
      color: #fff;
      transform: translateY(-1px);
    }

    /* Download Primary CTA */
    .download-btn {
      width: 100%;
      padding: 16px 24px;
      border-radius: var(--radius-md);
      background: var(--accent-gradient);
      border: none;
      color: #ffffff;
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 8px 28px var(--accent-glow);
      transition: all 0.25s var(--ease);
      margin-top: 4px;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 36px rgba(92, 124, 250, 0.5);
      filter: brightness(1.08);
    }

    .download-btn:active {
      transform: translateY(0);
    }

    /* Hidden file inputs */
    input[type="file"] {
      display: none;
    }

    /* Responsive */
    @media (max-width: 960px) {
      .studio-container {
        grid-template-columns: 1fr;
        padding: 16px;
        gap: 20px;
      }

      .app-header {
        padding: 12px 16px;
      }
    }
  </style>
</head>

<body>


  <!-- Hidden File Pickers -->
  <input type="file" id="phoneFile" accept="image/*">
  <input type="file" id="tabFile" accept="image/*">

  <!-- Main Studio Workspace -->
  <main class="studio-container">

    <!-- Left Column: Interactive Canvas Artboard -->
    <section class="artboard-stage">
      <div class="canvas-card">
        <div class="canvas-wrap">
          <canvas id="cv" width="2500" height="3000"
            title="Click on Phone or Tablet area to upload your screenshot"></canvas>
        </div>
        <div class="canvas-hints">
          <div class="hint-item">
            <span class="hint-dot"></span>
            <span>Tap phone or tablet on canvas to insert screenshots</span>
          </div>
          <span class="badge-pill">PNG 24-bit Output</span>
        </div>
      </div>

      <!-- Quick Upload Helpers -->
      <div class="quick-upload-row">
        <button class="upload-action-btn" onclick="phoneFile.click()">
          <span>📱</span>
          <span>Upload Phone Screen</span>
        </button>
        <button class="upload-action-btn" onclick="tabFile.click()">
          <span>💻</span>
          <span>Upload Tablet Screen</span>
        </button>
      </div>
    </section>

    <!-- Right Column: Controls & Styling Inspector -->
    <aside class="inspector-panel">

      <!-- Gradient & Background Settings -->
      <div class="control-card">
        <div class="card-title">
          <h3>🎨 Background &amp; Lighting</h3>
          <span class="card-tag">GRADIENT</span>
        </div>

        <div class="input-grid-2">
          <div class="input-field">
            <label>Color 1 (Start)</label>
            <div class="color-input-wrapper">
              <input id="c1" type="color" value="#000000">
              <input id="hex1" type="text" value="#000000" maxlength="7">
            </div>
          </div>

          <div class="input-field">
            <label>Color 2 (End)</label>
            <div class="color-input-wrapper">
              <input id="c2" type="color" value="#000000">
              <input id="hex2" type="text" value="#000000" maxlength="7">
            </div>
          </div>
        </div>

        <div class="input-grid-2">
          <div class="input-field">
            <label>Gradient Type</label>
            <select id="gtype" class="select-styled">
              <option value="Linear">Linear Gradient</option>
              <option value="Radial">Radial Spotlight</option>
            </select>
          </div>

          <div class="input-field">
            <div class="input-label-row">
              <label>Angle</label>
              <span class="val-badge" id="angleVal">90°</span>
            </div>
            <input id="angle" type="range" min="0" max="360" value="90">
          </div>
        </div>
      </div>

      <!-- Themes & Color Presets -->
      <div class="control-card">
        <div class="card-title">
          <h3>⚡ Quick Color Presets</h3>
          <span class="card-tag">THEMES</span>
        </div>

        <div class="preset-pills-wrap">
          <button type="button" class="preset-pill-btn" onclick="preset('blue')">Blue Modern</button>
          <button type="button" class="preset-pill-btn" onclick="preset('purple')">Purple Glow</button>
          <button type="button" class="preset-pill-btn" onclick="preset('dark')">Dark Onyx</button>
          <button type="button" class="preset-pill-btn" onclick="preset('nothing')">Nothing Mono</button>
          <button type="button" class="preset-pill-btn" onclick="preset('sunset')">Sunset Amber</button>
          <button type="button" class="preset-pill-btn" onclick="preset('forest')">Forest Mint</button>
          <button type="button" class="preset-pill-btn" onclick="preset('reset')">Reset</button>
        </div>

        <div class="input-field">
          <label>All Curated Styles</label>
          <select id="presetSelect" class="select-styled" onchange="applyPreset(this.value)">
            <option value="">Select Curated Palette...</option>
            <optgroup label="Modern Tech &amp; Apple">
              <option value="appleBlue">Apple Blue</option>
              <option value="nothingGray">Nothing Gray</option>
              <option value="spaceGray">Space Gray</option>
              <option value="midnight">Midnight Navy</option>
              <option value="amoled">AMOLED Pitch Black</option>
              <option value="titanium">Titanium Natural</option>
            </optgroup>
            <optgroup label="Ocean &amp; Sky">
              <option value="ocean">Deep Ocean</option>
              <option value="sky">Sky Blue</option>
              <option value="royalBlue">Royal Indigo</option>
              <option value="cyan">Electric Cyan</option>
              <option value="mint">Fresh Mint</option>
              <option value="emerald">Emerald Green</option>
            </optgroup>
            <optgroup label="Vibrant &amp; Glow">
              <option value="purple">Vibrant Purple</option>
              <option value="lavender">Pastel Lavender</option>
              <option value="violet">Deep Violet</option>
              <option value="rose">Velvet Rose</option>
              <option value="pink">Hot Pink</option>
              <option value="peach">Soft Peach</option>
            </optgroup>
            <optgroup label="Cyber &amp; Ambient">
              <option value="cyberpunk">Cyberpunk Neon</option>
              <option value="neon">Neon Teal</option>
              <option value="sunset">Warm Sunset</option>
              <option value="gold">Luxury Gold</option>
              <option value="coffee">Espresso Coffee</option>
              <option value="glass">Glass Frosted</option>
              <option value="ice">Ice Crystal</option>
            </optgroup>
          </select>
        </div>
      </div>

      <!-- Watermark & Branding -->
      <div class="control-card">
        <div class="card-title">
          <h3>🖋️ Studio Watermark</h3>
          <span class="card-tag">BRANDING</span>
        </div>

        <div class="input-field">
          <label>Signature Text</label>
          <input id="wmText" type="text" class="text-standalone" value="@ MR.JOY" placeholder="Enter branding name">
        </div>

        <div class="input-grid-2">
          <div class="input-field">
            <div class="input-label-row">
              <label>Font Size</label>
              <span class="val-badge" id="wmSizeVal">5px</span>
            </div>
            <input id="wmSize" type="range" min="3" max="18" value="5">
          </div>

          <div class="input-field">
            <div class="input-label-row">
              <label>Opacity</label>
              <span class="val-badge" id="wmOpacityVal">70%</span>
            </div>
            <input id="wmOpacity" type="range" min="0" max="100" value="70">
          </div>
        </div>

        <div class="input-field">
          <label>Text Color</label>
          <div class="color-input-wrapper">
            <input id="wmColor" type="color" value="#ffffff">
            <span style="font-family:var(--font-mono); font-size:0.8rem; color:var(--text-muted);">Watermark
              Color</span>
          </div>
        </div>
      </div>

      <!-- Download Button -->
      <button id="download" class="download-btn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download HD Mockup PNG</span>
      </button>

    </aside>
  </main>

  <script>
    const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
    let pImg = null, tImg = null;
    const phone = { w: 520, h: 1080 }, tab = { w: 1500, h: 1080 };
    phone.x = (2500 - (phone.w + tab.w + 140)) / 2;
    tab.x = phone.x + phone.w + 140;
    phone.y = tab.y = 930;

    phoneFile.onchange = e => load(e.target.files[0], i => { pImg = i; draw(); });
    tabFile.onchange = e => load(e.target.files[0], i => { tImg = i; draw(); });

    function load(f, cb) {
      if (!f) return;
      let i = new Image();
      i.onload = () => cb(i);
      i.src = URL.createObjectURL(f);
    }

    document.querySelectorAll("input,select").forEach(e => {
      e.addEventListener("input", function () {
        if (this.id === "angle" && document.getElementById("angleVal")) {
          document.getElementById("angleVal").textContent = this.value + "°";
        }
        if (this.id === "wmSize" && document.getElementById("wmSizeVal")) {
          document.getElementById("wmSizeVal").textContent = this.value + "px";
        }
        if (this.id === "wmOpacity" && document.getElementById("wmOpacityVal")) {
          document.getElementById("wmOpacityVal").textContent = this.value + "%";
        }
        draw();
      });
    });

    function rr(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function bg() {
      const rad = angle.value * Math.PI / 180;
      const cx = cv.width / 2;
      const cy = cv.height / 2;
      const len = Math.sqrt(cv.width * cv.width + cv.height * cv.height);

      const x1 = cx - Math.cos(rad) * len / 2;
      const y1 = cy - Math.sin(rad) * len / 2;
      const x2 = cx + Math.cos(rad) * len / 2;
      const y2 = cy + Math.sin(rad) * len / 2;

      let g;
      if (gtype.value === "Linear") {
        g = ctx.createLinearGradient(x1, y1, x2, y2);
      } else {
        g = ctx.createRadialGradient(cx, cy, 0, cx, cy, len / 2);
      }

      g.addColorStop(0.00, c1.value);
      g.addColorStop(0.40, c1.value);
      g.addColorStop(0.60, c2.value);
      g.addColorStop(1.00, c2.value);

      ctx.fillStyle = g;
      ctx.fillRect(0, 0, cv.width, cv.height);
    }

    function shadow(r) {
      ctx.save();
      ctx.filter = "blur(40px)";
      ctx.fillStyle = "rgba(0,0,0,.35)";
      rr(r.x - 0, r.y + 0, r.w, r.h, 75);
      ctx.fill();
      ctx.restore();
    }

    function dev(r, img) {
      shadow(r);
      ctx.save();
      rr(r.x, r.y, r.w, r.h, 75);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.clip();
      if (img) {
        let s = Math.max(r.w / img.width, r.h / img.height);
        let iw = img.width * s, ih = img.height * s;
        ctx.drawImage(img, r.x + (r.w - iw) / 2, r.y + (r.h - ih) / 2, iw, ih);
      } else {
        ctx.fillStyle = "#1e2230";
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.fillStyle = "#5c7cfa";
        ctx.font = "bold 52px Outfit, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Tap to Add Screen", r.x + r.w / 2, r.y + r.h / 2);
      }
      ctx.restore();
    }

    const DOT_FONT = {
      "@": ["0111110", "1000001", "1011101", "1010101", "1011111", "1000000", "0111110"],
      "A": ["01110", "10001", "10001", "11111", "10001", "10001", "10001"],
      "B": ["11110", "10001", "10001", "11110", "10001", "10001", "11110"],
      "C": ["01111", "10000", "10000", "10000", "10000", "10000", "01111"],
      "D": ["11110", "10001", "10001", "10001", "10001", "10001", "11110"],
      "E": ["11111", "10000", "10000", "11110", "10000", "10000", "11111"],
      "F": ["11111", "10000", "10000", "11110", "10000", "10000", "10000"],
      "G": ["01111", "10000", "10000", "10111", "10001", "10001", "01111"],
      "H": ["10001", "10001", "10001", "11111", "10001", "10001", "10001"],
      "I": ["11111", "00100", "00100", "00100", "00100", "00100", "11111"],
      "J": ["00111", "00010", "00010", "00010", "10010", "10010", "01100"],
      "K": ["10001", "10010", "10100", "11000", "10100", "10010", "10001"],
      "L": ["10000", "10000", "10000", "10000", "10000", "10000", "11111"],
      "M": ["10001", "11011", "10101", "10001", "10001", "10001", "10001"],
      "N": ["10001", "11001", "10101", "10011", "10001", "10001", "10001"],
      "O": ["01110", "10001", "10001", "10001", "10001", "10001", "01110"],
      "P": ["11110", "10001", "10001", "11110", "10000", "10000", "10000"],
      "Q": ["01110", "10001", "10001", "10001", "10101", "10010", "01101"],
      "R": ["11110", "10001", "10001", "11110", "10100", "10010", "10001"],
      "S": ["01111", "10000", "10000", "01110", "00001", "00001", "11110"],
      "T": ["11111", "00100", "00100", "00100", "00100", "00100", "00100"],
      "U": ["10001", "10001", "10001", "10001", "10001", "10001", "01110"],
      "V": ["10001", "10001", "10001", "10001", "10001", "01010", "00100"],
      "W": ["10001", "10001", "10001", "10101", "10101", "11011", "10001"],
      "X": ["10001", "10001", "01010", "00100", "01010", "10001", "10001"],
      "Y": ["10001", "10001", "01010", "00100", "00100", "00100", "00100"],
      "Z": ["11111", "00001", "00010", "00100", "01000", "10000", "11111"],
      "0": ["01110", "10001", "10011", "10101", "11001", "10001", "01110"],
      "1": ["00100", "01100", "00100", "00100", "00100", "00100", "01110"],
      "2": ["01110", "10001", "00001", "00010", "00100", "01000", "11111"],
      "3": ["11110", "00001", "00001", "01110", "00001", "00001", "11110"],
      "4": ["00010", "00110", "01010", "10010", "11111", "00010", "00010"],
      "5": ["11111", "10000", "11110", "00001", "00001", "10001", "01110"],
      "6": ["00110", "01000", "10000", "11110", "10001", "10001", "01110"],
      "7": ["11111", "00001", "00010", "00100", "01000", "01000", "01000"],
      "8": ["01110", "10001", "10001", "01110", "10001", "10001", "01110"],
      "9": ["01110", "10001", "10001", "01111", "00001", "00010", "01100"],
      " ": ["00000", "00000", "00000", "00000", "00000", "00000", "00000"],
      ".": ["00", "00", "00", "00", "00", "11", "11"],
      "-": ["00000", "00000", "00000", "11111", "00000", "00000", "00000"]
    };

    function drawDotChar(char, startX, startY, dotSize, gap, color, opacity) {
      const matrix = DOT_FONT[char.toUpperCase()];
      if (!matrix) return 0;
      ctx.save();
      ctx.fillStyle = color;
      ctx.globalAlpha = opacity;
      for (let row = 0; row < matrix.length; row++) {
        for (let col = 0; col < matrix[row].length; col++) {
          if (matrix[row][col] === "1") {
            const x = startX + col * (dotSize + gap);
            const y = startY + row * (dotSize + gap);
            ctx.beginPath();
            ctx.arc(x + dotSize / 2, y + dotSize / 2, dotSize / 2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
      ctx.restore();
      return matrix[0].length * (dotSize + gap);
    }

    function drawWatermark() {
      const text = wmText.value || "@ MR.JOY";
      const dotSize = parseInt(wmSize.value) || 5;
      const gap = Math.max(2, Math.round(dotSize * 0.7));
      const charSpacing = dotSize * 2.2;
      const color = wmColor.value;
      const opacity = wmOpacity.value / 100;

      let totalWidth = 0;
      for (let i = 0; i < text.length; i++) {
        const matrix = DOT_FONT[text[i].toUpperCase()];
        if (matrix) {
          totalWidth += matrix[0].length * (dotSize + gap);
          if (i < text.length - 1) {
            totalWidth += charSpacing;
          }
        }
      }

      // Position at the right-side head above the tablet mockup
      let startX = tab.x + tab.w - totalWidth;
      const matrixH = 7 * (dotSize + gap);
      const startY = tab.y - matrixH - 35;

      for (let char of text) {
        const w = drawDotChar(char, startX, startY, dotSize, gap, color, opacity);
        startX += w + charSpacing;
      }
    }

    function drawDate() {
      const today = new Date();
      const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      const text = String(today.getDate()).padStart(2, "0") + " " + months[today.getMonth()] + " " + today.getFullYear();
      ctx.save();
      ctx.fillStyle = "#FFFFFF";
      ctx.globalAlpha = 0.85;
      ctx.font = "bold 44px Space Grotesk, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(text, 120, 150);
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, 2500, 3000);
      bg();
      drawDate();
      dev(phone, pImg);
      dev(tab, tImg);
      drawWatermark();
      ctx.filter = "none";
    }

    cv.onclick = e => {
      let r = cv.getBoundingClientRect();
      let sx = 2500 / r.width, sy = 3000 / r.height;
      let x = (e.clientX - r.left) * sx, y = (e.clientY - r.top) * sy;
      let inside = o => x > o.x && x < o.x + o.w && y > o.y && y < o.y + o.h;
      if (inside(phone)) phoneFile.click();
      else if (inside(tab)) tabFile.click();
    };

    download.onclick = () => {
      let a = document.createElement("a");
      a.href = cv.toDataURL("image/png");
      a.download = "pixelcraftin-phone-tab-mockup.png";
      a.click();
    };

    c1.oninput = function () {
      hex1.value = c1.value.toUpperCase();
      draw();
    };

    c2.oninput = function () {
      hex2.value = c2.value.toUpperCase();
      draw();
    };

    hex1.oninput = function () {
      if (/^#[0-9A-Fa-f]{6}$/.test(hex1.value)) {
        c1.value = hex1.value;
        draw();
      }
    };

    hex2.oninput = function () {
      if (/^#[0-9A-Fa-f]{6}$/.test(hex2.value)) {
        c2.value = hex2.value;
        draw();
      }
    };

    function applyPreset(name) {
      const presets = {
        appleBlue: ["#6F8DFF", "#EAF1FF"],
        nothingGray: ["#E8E8E8", "#BFBFBF"],
        spaceGray: ["#444444", "#C2C2C2"],
        midnight: ["#101820", "#394867"],
        amoled: ["#000000", "#2D2D2D"],
        titanium: ["#737373", "#DDDDDD"],
        ocean: ["#006994", "#9BE7FF"],
        sky: ["#5DADE2", "#D6F5FF"],
        royalBlue: ["#2952CC", "#B8D4FF"],
        cyan: ["#00B8D9", "#D9FFFF"],
        mint: ["#39D98A", "#D9FFF1"],
        emerald: ["#008F68", "#BDF4D5"],
        forest: ["#1B5E20", "#A5D6A7"],
        olive: ["#556B2F", "#DCE8C4"],
        lime: ["#7CB342", "#F0FFD8"],
        purple: ["#7B61FF", "#E6DDFF"],
        lavender: ["#A084E8", "#F2EFFF"],
        violet: ["#5E35B1", "#D9CCFF"],
        rose: ["#D81B60", "#FFD7E8"],
        pink: ["#FF4D8D", "#FFE0EC"],
        peach: ["#FF9E80", "#FFF0E8"],
        sunset: ["#FF6A00", "#FFD194"],
        gold: ["#D4AF37", "#FFF6C5"],
        amber: ["#FFB300", "#FFF2B3"],
        coffee: ["#6F4E37", "#D7B899"],
        sand: ["#C2B280", "#F7F0D9"],
        glass: ["#FFFFFF", "#E8EDF7"],
        ice: ["#D6F3FF", "#F8FDFF"],
        cyberpunk: ["#FF0080", "#00F7FF"],
        neon: ["#00FFAA", "#00B3FF"]
      };

      if (!presets[name]) return;
      c1.value = presets[name][0];
      c2.value = presets[name][1];
      hex1.value = c1.value.toUpperCase();
      hex2.value = c2.value.toUpperCase();
      draw();
    }

    function preset(type) {
      switch (type) {
        case "blue":
          c1.value = "#7F8BFF";
          c2.value = "#DCE3FF";
          break;
        case "purple":
          c1.value = "#7A5FFF";
          c2.value = "#E7D8FF";
          break;
        case "dark":
          c1.value = "#111827";
          c2.value = "#4B5563";
          break;
        case "nothing":
          c1.value = "#F5F5F5";
          c2.value = "#D9D9D9";
          break;
        case "sunset":
          c1.value = "#FF6A00";
          c2.value = "#FFD200";
          break;
        case "forest":
          c1.value = "#0F766E";
          c2.value = "#A7F3D0";
          break;
        default:
          c1.value = "#8F95B8";
          c2.value = "#C8CAD6";
      }
      hex1.value = c1.value.toUpperCase();
      hex2.value = c2.value.toUpperCase();
      draw();
    }

    // Initial Render
    draw();
  </script>
</body>
